# MLflow tracking server + model registry -- mirrors the mlflow service
# in docker-compose.airflow.yml (sqlite backend, proxied artifacts).
# Image is built locally and `kind load`ed by `make k8s-up`, hence
# imagePullPolicy: Never.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: wc26
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: wc26
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: wc26/mlflow:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /mlflow
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: wc26
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - port: 5000
      nodePort: 30500
