# Airflow on kind -- scheduler + webserver, LocalExecutor (the scheduler
# doubles as the worker: tasks run as its subprocesses, matching the
# docker-compose stack and DECISIONS.md's 2026-07-03 LocalExecutor call --
# a single-DAG portfolio pipeline doesn't justify Celery + Redis + worker
# replicas here either).
#
# The repo is mounted read-write from the kind node's /project (see
# kind-config.yaml extraMounts) so the DAG's scripts write to data/ and
# dashboard/data/ exactly like a local run. The wc26-env Secret (created
# from .env by `make k8s-up`, optional) carries ODDS_API_KEY etc.
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-env
  namespace: wc26
data:
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
  MLFLOW_TRACKING_URI: http://mlflow:5000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: wc26
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: wc26/airflow:local
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - >
              airflow db migrate &&
              airflow users create --username admin --password admin
              --firstname Admin --lastname User --role Admin --email admin@example.com
          envFrom:
            - configMapRef:
                name: airflow-env
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: wc26
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      containers:
        - name: scheduler
          image: wc26/airflow:local
          imagePullPolicy: Never
          command: ["airflow", "scheduler"]
          envFrom:
            - configMapRef:
                name: airflow-env
            - secretRef:
                name: wc26-env
                optional: true
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: project
              mountPath: /opt/airflow/project
      volumes:
        - name: dags
          hostPath:
            path: /project/src/orchestration/dags
        - name: project
          hostPath:
            path: /project
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: wc26
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
        - name: webserver
          image: wc26/airflow:local
          imagePullPolicy: Never
          command: ["airflow", "webserver"]
          envFrom:
            - configMapRef:
                name: airflow-env
            - secretRef:
                name: wc26-env
                optional: true
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: project
              mountPath: /opt/airflow/project
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: dags
          hostPath:
            path: /project/src/orchestration/dags
        - name: project
          hostPath:
            path: /project
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: wc26
spec:
  type: NodePort
  selector:
    app: airflow-webserver
  ports:
    - port: 8080
      nodePort: 30080
