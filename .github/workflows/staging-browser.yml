name: Staged website verification
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  staging-browser:
    if: github.event.label.name == 'verify-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Validate the explicitly supplied staging origin
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const line=(process.env.PR_BODY||'').split(/\r?\n/).map(s=>s.trim()).find(s=>/^Staging origin: /.test(s));
          const origin=line?.slice('Staging origin: '.length);
          if(!origin||!/^https:\/\/dashboard-[a-z0-9]+-asmq333\.vercel\.app$/.test(origin))throw Error('No approved-format project staging origin supplied');
          fs.appendFileSync(process.env.GITHUB_ENV,'SPOPS_E2E_ORIGIN='+origin+'\n');
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:ci
        env:
          SPOPS_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-browser-evidence
          path: dashboard/e2e-results/
